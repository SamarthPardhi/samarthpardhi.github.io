<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple-style Ambient Background</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --text: #111;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
    }

    /* Soft atmospheric layer */
    .ambient {
      position: fixed;
      inset: -20%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      filter: blur(70px);
      opacity: 0.78;
    }

    .blob {
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 420px;
      min-height: 420px;
      border-radius: 50%;
      mix-blend-mode: multiply;
      will-change: transform;
    }

    .blob.one {
      background: radial-gradient(
        circle at 35% 35%,
        rgba(120, 145, 255, 0.48),
        rgba(120, 145, 255, 0.18) 45%,
        transparent 72%
      );
      animation: driftOne 19s cubic-bezier(.45,0,.55,1) infinite alternate;
    }

    .blob.two {
      background: radial-gradient(
        circle at 60% 40%,
        rgba(255, 145, 205, 0.40),
        rgba(255, 145, 205, 0.14) 45%,
        transparent 72%
      );
      animation: driftTwo 25s cubic-bezier(.45,0,.55,1) infinite alternate;
    }

    .blob.three {
      background: radial-gradient(
        circle at 45% 50%,
        rgba(90, 220, 210, 0.34),
        rgba(90, 220, 210, 0.10) 48%,
        transparent 72%
      );
      animation: driftThree 31s cubic-bezier(.45,0,.55,1) infinite alternate;
    }

    @keyframes driftOne {
      0%   { transform: translate(4vw, 5vh) scale(1); }
      35%  { transform: translate(48vw, 13vh) scale(1.12); }
      70%  { transform: translate(22vw, 48vh) scale(.88); }
      100% { transform: translate(68vw, 58vh) scale(1.18); }
    }

    @keyframes driftTwo {
      0%   { transform: translate(65vw, 4vh) scale(.9); }
      40%  { transform: translate(38vw, 44vh) scale(1.2); }
      75%  { transform: translate(3vw, 60vh) scale(.95); }
      100% { transform: translate(52vw, 18vh) scale(1.12); }
    }

    @keyframes driftThree {
      0%   { transform: translate(25vw, 65vh) scale(1); }
      50%  { transform: translate(68vw, 28vh) scale(1.22); }
      100% { transform: translate(12vw, 10vh) scale(.92); }
    }

    /* Very subtle grain prevents the gradients from looking synthetic */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    /* Example content */
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px;
      text-align: center;
    }

    .content {
      max-width: 780px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 9vw, 8rem);
      line-height: .9;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .footer {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 2;
      font-size: 10px;
      letter-spacing: 0.08em;
      font-weight: 400;
      color: rgba(0, 0, 0, .42);
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      .blob {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <main>
    <section class="content">
      <h1>working</h1>
    </section>
  </main>

  <div class="footer">Pune Reinsurance</div>
</body>
</html>
